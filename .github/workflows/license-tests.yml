name: License verification tests

on:
  push:
    branches:
      - codex/owner-signed-licenses
  pull_request:

permissions:
  contents: read

jobs:
  license-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/license.mjs
          node --check scripts/prepare-license-secrets.mjs
      - name: Certificate signature tests
        run: node --test tests/license.test.mjs
